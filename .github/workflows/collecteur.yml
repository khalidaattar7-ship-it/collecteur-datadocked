name: collecteur

# Une passe du collecteur temps réel Data Docked (python -m app.collecteur tick --executer).
#
# Planifiée toutes les 5 min (activée le 2026-11-12 après contrôle de coût : ~721 crédits/jour
# projetés, ~21 600/mois). Les déclenchements cron de GitHub peuvent être retardés de
# plusieurs minutes aux heures chargées. Les workflows planifiés d'un dépôt public sont coupés
# après 60 jours sans activité : keepalive.yml pousse un battement hebdomadaire.
on:
  workflow_dispatch:
    inputs:
      max_appels:
        description: "Plafond d'appels location de la passe (vide = aucun)"
        required: false
        default: ""
  schedule:
    # Toutes les 5 min, décalé de 3 min : GitHub déconseille les minutes rondes (:00, :05…),
    # les plus chargées, où les déclenchements sont retardés ou abandonnés.
    - cron: "3-58/5 * * * *"

# Une seule passe à la fois : une passe déclenchée pendant qu'une autre tourne attend (une seule
# en attente, les suivantes la remplacent) au lieu de se chevaucher. Le verrou consultatif
# PostgreSQL protège en plus contre tout autre lanceur.
concurrency:
  group: collecteur
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Code de sortie 2 = arrêt de sûreté (solde illisible, débit anormal, base injoignable) :
      # le job échoue, visible dans l'onglet Actions. Un plafond atteint n'est PAS un échec :
      # il est écrit dans le résumé de la passe.
      - name: Passe du collecteur
        env:
          DATADOCKED_API_KEY: ${{ secrets.DATADOCKED_API_KEY }}
          SUPABASE_DB_DSN: ${{ secrets.SUPABASE_DB_DSN }}
          MAX_APPELS: ${{ inputs.max_appels }}
          # Plafonds : variables de dépôt (Settings -> Variables), sinon ces valeurs par défaut.
          COLLECTOR_PLAFOND_JOUR: ${{ vars.COLLECTOR_PLAFOND_JOUR || '2000' }}
          COLLECTOR_PLAFOND_MOIS: ${{ vars.COLLECTOR_PLAFOND_MOIS || '55000' }}
          COLLECTOR_CIBLE_MOIS: ${{ vars.COLLECTOR_CIBLE_MOIS || '50000' }}
          # Sécurité SOLDE : dégradation pour que la dépense projetée jusqu'au renouvellement tienne
          # dans (solde − réserve) ; sous la réserve, LINER seuls au niveau le plus large.
          COLLECTOR_RESERVE_SOLDE: ${{ vars.COLLECTOR_RESERVE_SOLDE || '1000' }}
          COLLECTOR_JOUR_RENOUVELLEMENT: ${{ vars.COLLECTOR_JOUR_RENOUVELLEMENT || '18' }}
          # Fin du suivi in-port non-LINER (flux B). « aucune » pour le relancer.
          COLLECTOR_FIN_FLUX_B: ${{ vars.COLLECTOR_FIN_FLUX_B || '2026-12-02T00:00:00Z' }}
        run: |
          if [ -n "$MAX_APPELS" ]; then
            python -m app.collecteur tick --executer --max-appels "$MAX_APPELS"
          else
            python -m app.collecteur tick --executer
          fi
